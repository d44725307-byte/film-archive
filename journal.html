<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>资讯 · 黑白胶卷</title>
  <meta name="description" content="黑白胶卷的资讯：新闻、作品、手记。" />
    <link rel="canonical" href="https://film-archive-3be.pages.dev/journal" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .journal-all { padding: 26px 0 48px; max-width: 780px; }
    .journal-page-title { font-family:'Noto Serif SC',serif; font-weight:900; color:var(--film); font-size:30px; letter-spacing:2px; margin:0; }
    .journal-page-sub { font-family:'Playfair Display',serif; font-style:italic; font-size:13px; letter-spacing:2px; color:var(--accent); text-transform:uppercase; margin:6px 0 20px; }
    .j-list { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
    @media (max-width:720px){ .j-list { grid-template-columns:1fr; } }
  </style>

<meta name="google-site-verification" content="B3CefDZUQ6M7A8T5eNONFLpR874ZQ-oy1hY-Q7M8lkc" />

<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <div class="brand-text">
          <div class="brand-lockup">
            <h1 class="brand-cn">黑白胶卷</h1>
            <span class="brand-en">Black &amp; White Film</span>
          </div>
        </div>
      </div>
      <nav class="site-nav">
        <a href="index.html">胶卷库</a>
        <a class="active" href="journal.html">资讯</a>
        <a href="about.html">关于</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="journal-all">
      <h1 class="journal-page-title">资讯</h1>
      <p class="journal-page-sub">News</p>
      <div class="j-list" id="jAll"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copy">© 2026 黑白胶卷</p>
      <p class="footer-links"><a href="disclaimer.html">免责声明</a><span class="dot">·</span><a href="privacy.html">隐私政策</a></p>
    </div>
  </footer>

  <script>
    (async function () {
      const J_TYPE = { news: { cn: '新闻', cls: 'j-news' }, article: { cn: '文章', cls: 'j-article' }, work: { cn: '作品', cls: 'j-work' } };
      const esc = (s) => String(s).replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
      const list = document.getElementById('jAll');
      try {
        const res = await fetch('data/journal.json');
        const jd = await res.json();
        const items = jd.items || [];
        list.innerHTML = items.map((it) => {
          const t = J_TYPE[it.type] || J_TYPE.news;
          return '<a class="j-item" href="' + esc(it.link || '#') + '">'
            + (it.media ? '<img class="j-media" src="' + esc(it.media) + '" alt="" loading="lazy">' : '')
            + '<div class="j-meta"><span class="j-type ' + t.cls + '">' + t.cn + '</span><span class="j-date">' + esc(it.date || '') + '</span></div>'
            + '<div class="j-body"><div class="j-title">' + esc(it.title) + '</div>'
            + (it.excerpt ? '<div class="j-excerpt">' + esc(it.excerpt) + '</div>' : '') + '</div>'
            + '</a>';
        }).join('');
      } catch (e) { list.innerHTML = ''; }
    })();
  </script>
</body>
</html>
